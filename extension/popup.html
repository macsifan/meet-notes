<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Meet Notes</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1f1f1f;
        --muted: #5f6368;
        --line: #e0e0e0;
        --accent: #1a73e8;
        --danger: #d93025;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1f1f1f;
          --fg: #e8eaed;
          --muted: #9aa0a6;
          --line: #3c4043;
        }
      }
      body {
        width: 280px;
        margin: 0;
        padding: 16px;
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.45 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 15px;
        font-weight: 600;
      }
      button {
        width: 100%;
        padding: 10px;
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }
      button.recording {
        background: var(--danger);
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      #status {
        margin: 12px 0 0;
        color: var(--muted);
        font-size: 13px;
        min-height: 18px;
      }
      #status.error {
        color: var(--danger);
      }
      label {
        display: flex;
        gap: 8px;
        align-items: center;
        margin: 12px 0 0;
        color: var(--muted);
        font-size: 13px;
      }
      select {
        margin-left: auto;
        font: inherit;
        color: var(--fg);
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 2px 4px;
      }
      footer {
        margin-top: 14px;
        padding-top: 10px;
        border-top: 1px solid var(--line);
        font-size: 13px;
      }
      a {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <h1>Meet Notes</h1>
    <button id="toggle" disabled>Загрузка…</button>
    <label><input type="checkbox" id="autoRecord" checked /> Начинать запись автоматически</label>
    <label>
      Язык встречи
      <select id="language">
        <option value="ru">русский</option>
        <option value="en">английский</option>
        <option value="kk">казахский</option>
        <option value="auto">определять сам</option>
      </select>
    </label>
    <p id="status"></p>
    <footer><a href="http://127.0.0.1:8788/" target="_blank">Мои заметки</a></footer>
    <script src="popup.js"></script>
  </body>
</html>
